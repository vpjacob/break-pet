[package]
name = "break-pet"
version = "0.1.0"
description = "起身一下 · 桌面宠物"
authors = ["Break Pet"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "break_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = { version = "2.5.1", optional = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol", "autostart"]
autostart = ["dep:tauri-plugin-autostart"]
